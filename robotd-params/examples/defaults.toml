# Local schema example, not a hardware deployment profile.
[platform]
variant = "open_microduck"

[bus]
port = "/dev/ttyS2"
driver = "hd1910"

[imu]
bus = "/dev/i2c-imu"
address = 106

[control]
hz = 50
cmd_alpha = 0.2
head_alpha = 0.2

[update_gate]
min_achieved_hz = 45.0
stall_periods = 25
max_consecutive_errors = 10

[policy]
enabled = true
mode = "walk"
standing_action_scale = 1.0
standing_gain_ratio = 0.8
ground_pick_gain_ratio = 1.0
kick_duration = 0.5
roulade_duration = 1.0
roulade_action_scale = 1.0
roulade_gain_ratio = 1.0
voltage_adapt = false

[safety]
fall_gravity_z = -0.5
fall_debounce_ms = 200
deadman_ms = 500
battery_empty_shutdown = true
limp_fall = true
limp_fall_tilt_z = -0.9
limp_fall_predict_z = -0.5
limp_fall_lookahead_ms = 300
limp_fall_debounce_ms = 60
limp_fall_still_rate = 1.0
limp_fall_still_ms = 200
limp_fall_max_ms = 1500
limp_fall_pose_ms = 600
limp_fall_pose_gain = 160

[audio]
enabled = true
device = "plughw:aic3104"
bank = "/var/lib/robot/sounds"
greet = true
pet_enter_threshold = 0.95
pet_exit_threshold = 0.85

[theremin]
enabled = true
socket = "/run/tofd/tof.sock"
near_m = 0.1
far_m = 0.7
min_zones = 2
statuses = [
    4,
    5,
    6,
    9,
    10,
    12,
    13,
]
hold_ms = 250

[chorale]
accept = false

[media]
camera = true
quality = "720p30"
congestion_control = "gcc"

[detect]
enabled = false
hz = 2.0
threshold = 0.35

